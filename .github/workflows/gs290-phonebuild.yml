name: GS290 CLDC DevSpace Demo
on:
  push:
    branches: [main, fix/lg-gs290-cldc-touch-toolchain-20261022]
    paths:
      - 'templates/tools/phonebuild/**'
      - 'templates/project/app/demo/**'
      - '.github/workflows/gs290-phonebuild.yml'
  pull_request:
    paths:
      - 'templates/tools/phonebuild/**'
      - 'templates/project/app/demo/**'
      - '.github/workflows/gs290-phonebuild.yml'
  workflow_dispatch:

jobs:
  phonebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile DevSpace demo for CLDC 1.1
        run: |
          python3 templates/tools/phonebuild/main.py \
            --workspace "$GITHUB_WORKSPACE" \
            --project templates/project/app/demo
      - name: Validate Java 45.3 and MIDlet class
        run: |
          python3 templates/tools/phonebuild/main.py \
            --inspect-jar templates/project/app/demo/dist/j2me_devspace-demo.jar
      - name: Upload DevSpace demo JAR/JAD
        uses: actions/upload-artifact@v4
        with:
          name: GS290DevSpaceDemo-phone-ready
          path: |
            templates/project/app/demo/dist/j2me_devspace-demo.jar
            templates/project/app/demo/dist/j2me_devspace-demo.jad
          if-no-files-found: error
