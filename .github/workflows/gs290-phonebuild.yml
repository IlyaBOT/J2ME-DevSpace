name: GS290 CLDC Touch Test
on:
  push:
    branches:
      - main
      - fix/lg-gs290-cldc-touch-toolchain-20261022
    paths:
      - 'templates/tools/phonebuild/**'
      - 'templates/project/app/gs290-touch-test/**'
      - '.github/workflows/gs290-phonebuild.yml'
  pull_request:
    paths:
      - 'templates/tools/phonebuild/**'
      - 'templates/project/app/gs290-touch-test/**'
      - '.github/workflows/gs290-phonebuild.yml'
  workflow_dispatch:

jobs:
  phonebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile preverified CLDC 45.3 MIDlet
        run: |
          python3 templates/tools/phonebuild/main.py \
            --workspace "$GITHUB_WORKSPACE" \
            --project templates/project/app/gs290-touch-test
      - name: Inspect real phone JAR
        run: |
          python3 templates/tools/phonebuild/main.py \
            --inspect-jar templates/project/app/gs290-touch-test/dist/GS290TouchTest.jar
      - name: Upload JAR and JAD for device testing
        uses: actions/upload-artifact@v4
        with:
          name: GS290TouchTest-phone-ready
          path: |
            templates/project/app/gs290-touch-test/dist/GS290TouchTest.jar
            templates/project/app/gs290-touch-test/dist/GS290TouchTest.jad
          if-no-files-found: error
